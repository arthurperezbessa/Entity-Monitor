generate_report:
  name: Generate report
  description: >-
    Build a downtime report ranking the entities and integrations that go
    offline the most, with the number of outages and accumulated downtime.
    Call it with "return response" to receive the report inline.

reset_statistics:
  name: Reset statistics
  description: >-
    Clear cumulative outage counters and downtime totals. Entities that are
    currently unavailable keep their ongoing outage.

reset_all:
  name: Reset all data
  description: >-
    Zero everything: cumulative statistics, per-integration N1/N2/N3 state and
    every record of the current daily cycle. Ongoing outage timers are
    canceled. Use this for a hard reset.

test_notification:
  name: Send test notification
  description: >-
    Fire a sample notification through the configured notify service so
    you can verify the setup. Also fires the entity_monitor_notification
    event with a "test: true" flag.
